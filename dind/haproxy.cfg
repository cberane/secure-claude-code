# dind API guard — the only bridge between the sandbox network and the
# dind daemon (which lives on the isolated dind-net; the sandbox has no
# route to the raw API). Carries the network alias "dind" on the sandbox
# net: the agent sees dind:2376 (filtered API) and dind:<port> (apps).
#
# Policy:
#   * Image pulls (POST /images/create?fromImage=...) only for images
#     matching /etc/haproxy/images-allowlist.txt (regex per line).
#   * Image sideloading (docker load / import) is denied outright — it
#     would bypass the pull allowlist.
#   * Everything else passes through (build base images are pulled
#     daemon-internally by buildkit and cannot be filtered here; the
#     egress allowlist still bounds which registries are reachable).
#   * Common dev/app ports are TCP-forwarded 1:1 so services published
#     inside dind stay reachable from the sandbox.

global
    maxconn 512

defaults
    timeout connect 10s
    # Long client/server timeouts: image pulls and log streaming are slow.
    timeout client 30m
    timeout server 30m
    # attach/exec hijack the connection (Upgrade) — keep tunnels alive.
    timeout tunnel 1h

frontend docker_api
    mode http
    bind :2376

    # No image sideloading.
    http-request deny status 403 if { path_reg ^(/v[0-9.]+)?/images/load }
    http-request deny status 403 if { path_reg ^(/v[0-9.]+)?/images/create } { urlp(fromSrc) -m found }

    # Pull allowlist. url_dec: the client percent-encodes fromImage
    # (docker.io%2Flibrary%2F...), the allowlist regexes use plain slashes.
    acl is_pull path_reg ^(/v[0-9.]+)?/images/create
    acl img_allowed urlp(fromImage),url_dec -m reg -f /etc/haproxy/images-allowlist.txt
    http-request deny status 403 if is_pull !img_allowed

    default_backend dockerd

backend dockerd
    mode http
    server dind dind-daemon:2375

# App-port passthrough: forwards to the SAME port on the dind daemon
# (server line without a port = client's destination port). Extend the
# bind list for stacks using other ports; rootless dind cannot publish
# ports below 1024 anyway (Sail: APP_PORT=8080).
listen app_ports
    mode tcp
    bind :1025
    bind :3000
    bind :3306
    bind :5173
    bind :5432
    bind :6379
    bind :7700
    bind :8000-8100
    bind :8025
    bind :9000
    bind :9200
    bind :11211
    server dind dind-daemon
