# Squid egress proxy — allowlist-only forward proxy for the Claude sandbox.
#
# Policy:
#   * Only domains in /etc/squid/allowlist.txt are reachable.
#   * Destinations in private/link-local ranges are always denied, so the
#     sandbox can never reach the host LAN through the proxy.
#   * CONNECT is restricted to port 443.
#   * No caching, no disk state, logs to stdout.

http_port 3128

# --- ACLs ---------------------------------------------------------------
acl allowlist dstdomain "/etc/squid/allowlist.txt"

# Private, loopback and link-local destination ranges (host LAN protection).
acl to_localnet dst 0.0.0.1-0.255.255.255
acl to_localnet dst 10.0.0.0/8
acl to_localnet dst 100.64.0.0/10
acl to_localnet dst 127.0.0.0/8
acl to_localnet dst 169.254.0.0/16
acl to_localnet dst 172.16.0.0/12
acl to_localnet dst 192.168.0.0/16
acl to_localnet dst fc00::/7
acl to_localnet dst fe80::/10
acl to_localnet dst ::1/128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# --- Access policy (order matters) --------------------------------------
http_access deny to_localnet
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all

# --- No disk state, no identifying headers ------------------------------
cache deny all
access_log stdio:/dev/stdout squid
cache_log /dev/stderr
cache_store_log none
pid_filename none
via off
forwarded_for delete
httpd_suppress_version_string on
# IPv4-only operation comes from the container's disabled IPv6 (compose
# sysctls) — squid detects it at startup and skips AAAA records.
# (dns_v4_first was removed in squid 5 and must not be used here.)

# No ICMP measurement helper — impossible without CAP_NET_RAW (cap_drop ALL)
pinger_enable off

# Fail fast on dead upstreams
connect_timeout 15 seconds
# Retry the next resolved address instead of failing on the first dead one.
forward_max_tries 5
read_timeout 5 minutes
