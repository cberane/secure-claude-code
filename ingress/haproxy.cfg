# Host ingress — inbound-only forwarder so a dev server in the sandbox is
# reachable from the host browser at http://localhost:8080, plus selected
# service ports published inside dind (see `listen dind_services`).
#
# Strictly one-directional: it only accepts connections from the host and
# forwards them INTO the sandbox network; it gives sandbox containers no
# outbound path. Two candidate targets, first healthy one wins:
#   1. claude-session:8080 — a dev server run in the interactive session
#      (make shell/claude/yolo name their container "claude-session";
#      bind it to 0.0.0.0:8080, e.g. `php artisan serve --host=0.0.0.0`)
#   2. dind:8080          — an app published inside the dind sidecar
#      (e.g. Laravel Sail with APP_PORT=8080), used as backup

global
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m

# Docker's embedded DNS; init-addr none lets haproxy start even while a
# target name does not resolve yet (session not running, profile off).
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s
    hold other 2s
    hold refused 2s
    hold nx 2s

listen app
    bind :8080
    option tcp-check
    default-server resolvers docker init-addr none check inter 3s
    server session claude-session:8080
    server sail dind:8080 backup

# Services published inside the dind sidecar (Sail: vite, postgres,
# mailpit). The server line carries no port, so each connection goes to the
# SAME port on the dind guard, which forwards it to the daemon. Extend both
# this bind list and the override's `ports:` to expose another port; it must
# also be forwarded by dind/haproxy.cfg (`listen app_ports`).
#
# No `check` here: health checks need a fixed port, which a portless server
# has not. Single server, no failover — if the service is down the
# connection just fails, exactly as when talking to it directly.
listen dind_services
    bind :5173
    bind :5432
    bind :8025
    server dind dind resolvers docker init-addr none
