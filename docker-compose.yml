# Hardened Claude Code sandbox.
#
# Two services, two networks:
#   claude-code  — only on the internal network; NO direct internet access.
#   egress-proxy — the single way out; enforces the domain allowlist.
#
# The internal network is `internal: true`, so the claude-code container cannot
# reach the host LAN or the internet directly — every connection must go
# through the proxy, which only permits allowlisted domains on port 443/80.

name: claude-sandbox

services:
  claude-code:
    build:
      context: .
      target: runtime
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        # Comma list of optional language toolchains, e.g. "php,python".
        TOOLCHAINS: ${TOOLCHAINS:-}
    env_file:
      - path: .env
        required: false
    environment:
      # Lets doctor run the function checks matching the built toolchains.
      SANDBOX_TOOLCHAINS: ${TOOLCHAINS:-}
      # allowlist (default) | learning — set via `make learn`, never by hand.
      # In learning mode the entrypoint REFUSES to start with the signing
      # key mounted (compose.learning.yml removes it).
      EGRESS_MODE: ${EGRESS_MODE:-allowlist}
      # Docker CLI target: the dind-guard filter in front of the rootless
      # dind sidecar (docker toolchain + profile only; the variable is
      # inert when the CLI is not installed).
      DOCKER_HOST: tcp://dind:2376
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,dind
      no_proxy: localhost,127.0.0.1,dind
    networks:
      - sandbox
    depends_on:
      - egress-proxy
    # --- runtime hardening -------------------------------------------------
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # mode=1777 (not uid=/gid= options): sticky world-writable is portable —
    # podman rejects uid=/gid= tmpfs options that docker accepts.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${TMP_SIZE:-512m},mode=1777
    pids_limit: ${PIDS_LIMIT:-512}
    mem_limit: ${MEM_LIMIT:-4g}
    cpus: ${CPUS:-2}
    ulimits:
      nofile:
        soft: ${NOFILE:-4096}
        hard: ${NOFILE:-4096}
    # --- mounts: exactly ONE writable bind mount ---------------------------
    volumes:
      - ${PROJECTS_DIR:?Set PROJECTS_DIR in .env}:/workspace:rw
      - claude-config:/home/dev/.claude
      - ./secrets/git-signing/:/run/secrets/git-signing/:ro
      - egress-logs:/var/log/egress:ro
    working_dir: /workspace
    stdin_open: true
    tty: true

  egress-proxy:
    build:
      context: ./egress
      args:
        # The enabled toolchains drive which allowlist fragments the
        # proxy bakes in (egress/allowlist.d/).
        TOOLCHAINS: ${TOOLCHAINS:-}
    environment:
      # allowlist (default) | learning — the entrypoint selects the squid
      # config accordingly. Toggled by `make learn` / `make learn-off`.
      EGRESS_MODE: ${EGRESS_MODE:-allowlist}
    networks:
      sandbox:
      egress:
      dind-net:
        # Static: nested containers inside dind reach the proxy by IP
        # (they cannot resolve the "egress-proxy" name).
        ipv4_address: 172.30.0.3
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/spool/squid:rw,nosuid,size=16m,mode=1777
    volumes:
      - egress-logs:/var/log/squid
    pids_limit: 128
    mem_limit: 256m
    user: proxy
    # No IPv6 in the proxy netns: squid then resolves A records only.
    # With v6 enabled but unrouted (default docker bridge, WSL2), squid picks
    # AAAA addresses and fails CONNECTs with an instant 503.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1

  # Rootless docker-in-docker daemon — ONLY started when the `docker`
  # compose profile is active (the Makefile activates it when TOOLCHAINS
  # contains "docker"). Trade-off, documented in DECISIONS.md: `privileged`
  # is unavoidable even rootless, but the daemon runs in a user namespace,
  # so the agent controlling its API is root only inside that userns.
  # Lives on the isolated dind-net ONLY: the sandbox has no route to the
  # raw API on 2375 — every access goes through dind-guard. Registry
  # traffic leaves via the egress proxy (also on dind-net).
  dind-daemon:
    image: docker:29-dind-rootless@sha256:7451e3dc398b11ba2d8183bb7915402683e3d32e5ec8cef835c215f314a65fef
    profiles: ["docker"]
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      # Registry pulls done by the daemon go through the egress allowlist.
      # By IP: keeps daemon and nested containers on one proxy address.
      HTTP_PROXY: http://172.30.0.3:3128
      HTTPS_PROXY: http://172.30.0.3:3128
      NO_PROXY: localhost,127.0.0.1
    networks:
      - dind-net
    depends_on:
      - egress-proxy
    volumes:
      - dind-storage:/home/rootless/.local/share/docker
      # Same path as in claude-code, so bind mounts in nested compose
      # files (e.g. Sail's ".:/var/www/html") resolve to the same files.
      - ${PROJECTS_DIR:?Set PROJECTS_DIR in .env}:/workspace:rw
    pids_limit: 1024
    mem_limit: ${DIND_MEM_LIMIT:-4g}

  # API guard: the ONLY bridge between the sandbox and the dind daemon.
  # Exposes the FILTERED Docker API on :2376 (image pull allowlist, no
  # sideloading) and TCP-forwards common dev/app ports so services
  # published inside dind stay reachable. Carries the network alias
  # "dind" on the sandbox net, so the agent-facing names stay dind:2376
  # (API) and dind:<port> (apps).
  dind-guard:
    image: haproxy:3.2-alpine@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047
    profiles: ["docker"]
    networks:
      sandbox:
        aliases:
          - dind
      dind-net: {}
    depends_on:
      - dind-daemon
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    volumes:
      - ./dind/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./dind/images-allowlist.txt:/etc/haproxy/images-allowlist.txt:ro

networks:
  # internal: true — no gateway to the outside world or the host LAN.
  sandbox:
    internal: true
  # Only the proxy sits on a network with external connectivity.
  egress: {}
  # Isolated net for the dind daemon: members are dind-daemon, dind-guard
  # and egress-proxy — never claude-code, so the unfiltered API stays out
  # of the sandbox's reach. Fixed subnet: containers NESTED inside dind
  # (Sail builds/services) have no DNS for outer compose names, so they
  # reach the egress proxy by its static IP (172.30.0.3, also baked into
  # the sandbox image's docker client config).
  dind-net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  # Persistent Claude Code session/config state (OAuth token lives here).
  claude-config:
  # Squid access log, shared read-only into the sandbox for blocked-domains.
  # tmpfs-backed: size-capped, ephemeral (gone when the last user stops);
  # additionally truncated by the proxy entrypoint on every start.
  egress-logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=1777"
  # Image/layer storage of the dind sidecar (docker profile only).
  dind-storage:
