# Local compose override — EXAMPLE.
#
# Copy to docker-compose.override.yml (gitignored) for machine-specific
# tweaks that don't belong in git. Docker Compose auto-loads that filename;
# the Makefile adds it explicitly for podman.
#
# WARNING: an override can silently WEAKEN the hardening (extra mounts,
# capabilities, network changes). Run `make doctor` after every change —
# it re-verifies the security posture.
#
# Copied unedited, this file is a harmless no-op.

services: {}

# --- Example 1: host ingress ----------------------------------------------
# Reach a sandbox dev server at http://localhost:8080, plus selected
# services published inside dind (vite, postgres, mailpit UI). Inbound-only
# (no outbound path for the sandbox); target logic in ingress/haproxy.cfg.
# To expose another port, bind it there AND list it here. Keep the
# "127.0.0.1:" prefix — publishing on 0.0.0.0 would put the sandbox's
# services on your LAN.
#
# Replace the `services: {}` line above with this block:
#
# services:
#   ingress:
#     image: haproxy:3.2-alpine@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047
#     ports:
#       - "127.0.0.1:8080:8080"
#       - "127.0.0.1:5173:5173"
#       - "127.0.0.1:5432:5432"
#       - "127.0.0.1:8025:8025"
#     networks: [sandbox, ingress]
#     read_only: true
#     security_opt: [no-new-privileges:true]
#     cap_drop: [ALL]
#     pids_limit: 64
#     mem_limit: 64m
#     volumes:
#       - ./ingress/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
#
# networks:
#   # Non-internal net carrying only the host port binding.
#   ingress: {}

# --- Example 2: resource / mount tweaks for the sandbox -------------------
# These belong under services.claude-code. Language toolchains do NOT go
# here — set TOOLCHAINS in .env instead (the proxy allowlist and doctor
# follow that variable).
#
# services:
#   claude-code:
#     # More memory for a heavy project:
#     mem_limit: 8g
#     # Opt-in custom seccomp profile (read security/seccomp.json first!):
#     security_opt:
#       - no-new-privileges:true
#       - seccomp=./security/seccomp.json
#     # Extra READ-ONLY mount (never add writable host mounts):
#     volumes:
#       - ~/.cache/composer:/home/dev/.cache/composer:ro
