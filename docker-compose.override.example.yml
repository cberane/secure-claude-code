# Local compose override — EXAMPLE.
#
# Copy to docker-compose.override.yml (gitignored) for machine-specific
# tweaks that don't belong in git. Docker Compose auto-loads that filename;
# the Makefile adds it explicitly for podman.
#
# WARNING: an override can silently WEAKEN the hardening (extra mounts,
# capabilities, network changes). Run `make doctor` after every change —
# it re-verifies the security posture.
#
# Copied unedited, this file is a harmless no-op.

services: {}

# --- examples (move under `services:` and uncomment) -----------------------
#
# services:
#   claude-code:
#     # Language toolchains belong in .env (TOOLCHAINS=php,python), not
#     # here — the proxy allowlist and doctor follow that variable.
#
#   # Host ingress: reach a sandbox dev server at http://localhost:8080.
#   # Inbound-only (no outbound path for the sandbox); target logic in
#   # ingress/haproxy.cfg (interactive session first, Sail app as backup).
#   # The further ports reach services published inside dind (vite, postgres,
#   # mailpit). To add one, bind it in ingress/haproxy.cfg AND list it here —
#   # and keep the "127.0.0.1:" prefix, or the sandbox's services end up on
#   # your LAN.
#   ingress:
#     image: haproxy:3.2-alpine@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047
#     ports:
#       - "127.0.0.1:8080:8080"
#       - "127.0.0.1:5173:5173"
#       - "127.0.0.1:5432:5432"
#       - "127.0.0.1:8025:8025"
#     networks: [sandbox, ingress]
#     read_only: true
#     security_opt: [no-new-privileges:true]
#     cap_drop: [ALL]
#     pids_limit: 64
#     mem_limit: 64m
#     volumes:
#       - ./ingress/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
#
# networks:
#   ingress: {}
#     # More memory for a heavy project:
#     mem_limit: 8g
#     # Opt-in custom seccomp profile (read security/seccomp.json first!):
#     security_opt:
#       - no-new-privileges:true
#       - seccomp=./security/seccomp.json
#     # Extra READ-ONLY mount (never add writable host mounts):
#     volumes:
#       - ~/.cache/composer:/home/dev/.cache/composer:ro
